const runeColorNow=RUNE_GREY.clone();
setBiome('dark');
disposeMonster();
const lookTarget=new THREE.Vector3(0,2.6,0);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05, clock.getDelta());
  elapsed+=dt;
  castCooldown=Math.max(0,castCooldown-dt);

  // the rune never stops revolving
  runeA.rotation.z += dt*0.25;
  runeB.rotation.z -= dt*0.12;
  runeIntensity += (runeIntensityTarget-runeIntensity)*Math.min(1,dt*3);
  runeColorNow.lerp(runeTargetColor, Math.min(1,dt*3));
  runeMatA.color.copy(runeColorNow); runeMatB.color.copy(runeColorNow);
  const pulse=0.85+Math.sin(elapsed*3)*0.15;
  runeMatA.opacity=(0.55+runeIntensity*0.45)*pulse;
  runeMatB.opacity=0.2+runeIntensity*0.35;
  runeLight.intensity += ((0.7+runeIntensity*1.8)-runeLight.intensity)*Math.min(1,dt*2.5);
  runeLight.color.lerp(runeColorNow, Math.min(1,dt*2));
  animate._pr=(animate._pr||0)+dt;
  if(animate._pr>0.15){ animate._pr=0; panelRune.style.color='#'+runeColorNow.getHexString(); }
  monsterGlow.material.opacity += (((currentMonster&&mob.alive)?0.22:0)-monsterGlow.material.opacity)*Math.min(1,dt*3);

  // ---------- monster: idle motion + AI ----------
  if(currentMonster){
    const m=currentMonster;
    const hover=m.userData.hover||0;
    const spd=m.userData.sp||0;
    const gaitK=Math.min(1, spd/1.0);
    let bobY, tiltZ=0;
    if(hover>0.25){
      // true flyers drift on the air
      bobY = Math.sin(elapsed*1.6)*0.12 + hover*(0.5+0.5*Math.sin(elapsed*1.1));
    } else if(m.userData.gait==='hop'){
      // the gnome HOPS: bouncing strides, wobbling side to side
      bobY = Math.abs(Math.sin(elapsed*7))*0.26*Math.max(gaitK,0.12);
      tiltZ = Math.sin(elapsed*7)*0.09*Math.max(gaitK,0.25);
    } else if(m.userData.gait==='stomp'){
      bobY = Math.abs(Math.sin(elapsed*4.2))*0.09*gaitK;
      tiltZ = Math.sin(elapsed*4.2)*0.045*Math.max(gaitK,0.2);
    } else {
      // gliders barely skim the ground
      bobY = 0.08 + Math.sin(elapsed*1.7)*0.06 + hover*(0.5+0.5*Math.sin(elapsed*1.1));
    }

    if(mob.alive && !busy){
      // roam within the summoning circle
      mob.wpTimer-=dt;
      if(mob.wpTimer<=0){
        mob.wpTimer=rnd(1.6,3.4);
        const a=Math.random()*Math.PI*2, r=rnd(0,2.4);
        mob.wp.set(Math.cos(a)*r,0,Math.sin(a)*r);
      }
      let speed=1.1;
      let targetPos=mob.wp;
      if(mob.dodge){
        mob.dodge.t+=dt;
        targetPos=m.position.clone().add(mob.dodge.dir);
        speed=6.5;
        if(mob.dodge.t>=mob.dodge.dur) mob.dodge=null;
      }
      const to=targetPos.clone().sub(m.position); to.y=0;
      const d=to.length();
      let moved=0;
      if(d>0.05){
        to.normalize().multiplyScalar(Math.min(d,speed*dt));
        m.position.add(to);
        moved=to.length();
      }
      m.userData.sp = (m.userData.sp||0)*0.9 + (moved/Math.max(dt,1e-4))*0.1;
      // keep within arena
      const rr=Math.sqrt(m.position.x*m.position.x+m.position.z*m.position.z);
      if(rr>3.2){ m.position.x*=3.2/rr; m.position.z*=3.2/rr; }
      // the beast turns to FACE the threat while a portal charges
      if(mob.face){
        const fd=mob.face.clone().sub(m.position);
        m.rotation.y += (Math.atan2(fd.x,fd.z)-m.rotation.y)*Math.min(1,dt*7);
      } else if(d>0.2){
        m.rotation.y += (Math.atan2(to.x,to.z)-m.rotation.y)*Math.min(1,dt*3);
      }

      // the deflection rune hovers between beast and threat, spinning
      if(mob.barrier){
        const b=mob.barrier;
        const chest=m.position.clone().add(new THREE.Vector3(0,3,0));
        const dir=b.toward.clone().sub(chest); dir.normalize();
        b.group.position.copy(chest).add(dir.multiplyScalar(mob.hitR+1.4));
        b.group.lookAt(b.toward);
        b.disc.rotation.z+=dt*2.4; b.disc2.rotation.z-=dt*1.3; b.ring.rotation.z+=dt*0.8;
      }
    }
    m.position.y = bobY;
    m.rotation.z += (tiltZ - m.rotation.z)*Math.min(1,dt*8);

    applyFlash(dt);

    // living gaze: pupils swivel toward the threat (or the watcher)
    const gazeTarget = mob.face || camera.position;
    const _ew=new THREE.Vector3(), _ld=new THREE.Vector3();
    m.traverse(o=>{
      if(o.userData.isEye){
        o.worldToLocal(_ld.copy(gazeTarget)); _ld.normalize();
        const R=o.userData.eyeR;
        const px=Math.max(-1,Math.min(1,_ld.x))*R*0.38;
        const py=Math.max(-0.7,Math.min(0.7,_ld.y))*R*0.3;
        o.userData.pupil.position.x += (px-o.userData.pupil.position.x)*Math.min(1,dt*7);
        o.userData.pupil.position.y += (py-o.userData.pupil.position.y)*Math.min(1,dt*7);
        o.userData.iris.position.x = o.userData.pupil.position.x*0.6;
        o.userData.iris.position.y = o.userData.pupil.position.y*0.6;
      }
      if(o.userData.armSway){
        const A=o.userData.armSway;
        o.rotation.z=(A.bz||0)+Math.sin(elapsed*1.5+A.ph)*(A.az||0.12);
        o.rotation.x=(A.bx||0)+Math.sin(elapsed*1.15+A.ph*1.3)*(A.ax||0.08);
      }
      if(o.userData.orbit) o.rotation.y += dt*0.9;
      if(o.userData.spin){ o.rotation.y += dt*2.2; o.rotation.x += dt*0.7; }
      if(o.userData.tent!==undefined){ o.rotation.x=Math.sin(elapsed*2+o.userData.tent)*0.28; o.rotation.z=Math.cos(elapsed*1.6+o.userData.tent)*0.22; }
      if(o.userData.flap!==undefined){ o.rotation.y=o.userData.flap*Math.sin(elapsed*9)*0.55; }
      if(o.userData.pulse){ const s=1+Math.sin(elapsed*5)*0.15; o.scale.setScalar(s); }
      if(o.userData.tome){ o.position.set(Math.cos(elapsed*0.9)*1.6, 3.6+Math.sin(elapsed*1.7)*0.25, Math.sin(elapsed*0.9)*1.6); o.rotation.y=elapsed*0.9+Math.PI/2; o.rotation.z=Math.sin(elapsed*2)*0.15; }
    });
    // siren tail: sinuous sway, flukes sweeping
    if(m.userData.tailSegs){
      const segs=m.userData.tailSegs;
      for(let i=0;i<segs.length;i++){
        const ph=elapsed*2.0 + i*0.62;
        segs[i].position.x=Math.sin(ph)*0.16*(1+i*0.22);
        segs[i].position.z=Math.cos(ph*0.8)*0.1*(1+i*0.15);
        segs[i].position.y=segs[i].userData.baseY + Math.sin(ph*0.6)*0.05;
      }
    }
    // sprite wisp-tail undulates; its aura sheds motes
    m.traverse(o=>{ if(o.userData.wisp!==undefined){ const i=o.userData.wisp; o.position.x=Math.sin(elapsed*3+i*0.9)*0.12*(i+1)*0.4; } });
    if(m.userData.aura && Math.random()<0.3){
      spawnBurst({origin:m.position.clone().add(new THREE.Vector3(rnd(-1.2,1.2),rnd(1.5,4.5),rnd(-1.2,1.2))),count:2,speed:0.5,size:0.11,color:m.userData.aura,life:0.9,gravity:0.8,up:true});
    }
  }

  sceneryGroup.traverse(o=>{
    if(o.userData.isKelp) o.rotation.z=Math.sin(elapsed*1.2+o.userData.sway)*0.14;
    if(o.userData.isFloat) o.position.y += Math.sin(elapsed*0.8+o.userData.float)*dt*0.3;
  });
  sceneryGroup.traverse(o=>{
    if(o.userData.spinPortal) o.rotation.z += dt*o.userData.spinPortal;
    if(o.userData.pulse2) o.material.opacity=0.35+0.2*Math.sin(elapsed*1.6);
    if(o.userData.flicker!==undefined) o.intensity = (o.userData.baseInt||(o.userData.baseInt=o.intensity)) * (0.75+0.25*Math.sin(elapsed*o.userData.flicker)+0.12*Math.sin(elapsed*o.userData.flicker*2.7));
    if(o.userData.groundFog!==undefined){
      o.position.x += Math.sin(elapsed*0.12+o.userData.groundFog)*dt*0.8;
      o.material.opacity = 0.26+0.1*Math.sin(elapsed*0.35+o.userData.groundFog);
    }
  });
  // far-off storms rake the horizon
  animate._storm=(animate._storm===undefined?rnd(6,12):animate._storm)-dt;
  if(animate._storm<=0){
    animate._storm=rnd(9,17);
    const a=Math.random()*Math.PI*2, R=rnd(35,55);
    const top=new THREE.Vector3(Math.cos(a)*R, rnd(24,34), Math.sin(a)*R);
    const bot=new THREE.Vector3(top.x+rnd(-6,6), 0, top.z+rnd(-6,6));
    boltFX(top,bot,0xd8c8ff,2,0.35);
    boltFX(top,bot,0x8b5aff,1,0.4);
    const fl=new THREE.PointLight(0xb8a0ff,3.5,90,2); fl.position.copy(top).setY(18); scene.add(fl);
    tween(0.45,u=>{ fl.intensity=3.5*(1-u); }).then(()=>scene.remove(fl));
    sfx.thunder();
  }
  if(patchGroup){
    patchGroup.traverse(o=>{
      if(o.userData.isKelp) o.rotation.z=Math.sin(elapsed*1.4+o.userData.sway)*0.18;
      if(o.userData.water){ o.material.opacity=0.45+Math.sin(elapsed*1.8)*0.12; o.rotation.z+=dt*0.05; }
    });
    if(patchGroup.userData.bubbles && Math.random()<0.12){
      const a=Math.random()*Math.PI*2, r=rnd(3.2,5.6);
      spawnBurst({origin:new THREE.Vector3(Math.cos(a)*r,0.2,Math.sin(a)*r),count:3,speed:1,size:0.1,color:0xaef3ff,life:1.2,gravity:2.4,up:true});
    }
  }

  updateBursts(dt); updateAmbient(dt); updateRunners(dt); updateBiomeLerp(dt);

  // cinematic drifting camera; gaze follows the beast
  // impact punch: the lens kicks wide with every shockwave, then settles
  const wantFov=46+shakeAmt*7;
  if(Math.abs(camera.fov-wantFov)>0.02){ camera.fov=camera.fov+(wantFov-camera.fov)*Math.min(1,dt*10); camera.updateProjectionMatrix(); }
  const camAng=Math.sin(elapsed*0.11)*0.35;
  const dist=17.5+Math.sin(elapsed*0.07)*1.2;
  camera.position.x=Math.sin(camAng)*dist + (Math.random()-0.5)*shakeAmt;
  camera.position.z=Math.cos(camAng)*dist + (Math.random()-0.5)*shakeAmt;
  camera.position.y=4.9+Math.sin(elapsed*0.09)*0.7 + (Math.random()-0.5)*shakeAmt;
  shakeAmt=Math.max(0,shakeAmt-dt*1.6);
  const want=currentMonster?new THREE.Vector3(currentMonster.position.x*0.5,2.6,currentMonster.position.z*0.5):new THREE.Vector3(0,2.6,0);
  lookTarget.lerp(want, Math.min(1,dt*2));
  camera.lookAt(lookTarget);

  if(currentMonster) monsterGlow.position.set(currentMonster.position.x,0.03,currentMonster.position.z);

  renderer.render(scene,camera);
}
animate();
})();
</script>
