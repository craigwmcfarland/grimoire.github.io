<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire of Deeds — Summon Your Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0910;
  --panel:#14101d;
  --parchment:#e8dcc0;
  --gold:#c9a15a;
  --gold-bright:#f0cc7e;
  --fire:#ff6a2a; --ice:#5ad2ff; --storm:#b18cff; --dark:#8b2fd6; --arcane:#3f7bff; --nature:#59d64a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:'Spectral',serif;color:var(--parchment)}
#scene{position:fixed;inset:0;display:block}
/* ------------- LEFT GRIMOIRE PANEL ------------- */
#grimoire{
  position:fixed;top:0;left:0;bottom:0;width:min(33.5vw,460px);min-width:330px;
  background:linear-gradient(160deg, rgba(24,18,34,.94), rgba(12,9,18,.96));
  border-right:1px solid rgba(201,161,90,.35);
  box-shadow: 8px 0 40px rgba(0,0,0,.6), inset -1px 0 0 rgba(240,204,126,.12);
  display:flex;flex-direction:column;z-index:10;backdrop-filter: blur(6px);
}
#grimoire::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 40% at 50% 0%, rgba(201,161,90,.10), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);
}
header{padding:26px 26px 14px;position:relative}
header .eyebrow{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.42em;color:var(--gold);
  text-transform:uppercase;opacity:.85
}
header h1{
  font-family:'Cinzel',serif;font-weight:900;font-size:clamp(22px,2.2vw,30px);
  letter-spacing:.06em;color:var(--parchment);margin-top:6px;line-height:1.15;
  text-shadow:0 0 22px rgba(201,161,90,.25)
}
header .rule{height:1px;margin-top:14px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
#xpRow{display:flex;align-items:center;gap:10px;margin-top:12px}
#rankName{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-bright);white-space:nowrap}
#lvlTag{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;color:rgba(232,220,192,.6);white-space:nowrap}
.xpbar{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid rgba(201,161,90,.35);overflow:hidden}
#xpFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .6s;box-shadow:0 0 8px rgba(240,204,126,.7)}
/* ------------- ADD TASK ------------- */
#summonForm{padding:16px 26px 6px}
label.fieldlab{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin:10px 0 5px}
#taskName, #taskDue{
  width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(201,161,90,.35);
  color:var(--parchment);font-family:'Spectral',serif;font-size:15px;
  padding:10px 12px;border-radius:3px;outline:none;transition:border-color .2s, box-shadow .2s;
}
#taskName::placeholder{color:rgba(232,220,192,.35);font-style:italic}
#taskName:focus,#taskDue:focus{border-color:var(--gold-bright);box-shadow:0 0 0 2px rgba(240,204,126,.15), 0 0 18px rgba(201,161,90,.15)}
#taskDue{color-scheme:dark}
.row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
#summonBtn{
  font-family:'Cinzel',serif;font-weight:700;letter-spacing:.14em;font-size:13px;
  color:#1a1206;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  border:1px solid #7a5c26;border-radius:3px;padding:11px 18px;cursor:pointer;
  text-transform:uppercase;box-shadow:0 2px 14px rgba(201,161,90,.35), inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .12s, box-shadow .2s, filter .2s;
}
#summonBtn:hover{filter:brightness(1.08);box-shadow:0 3px 22px rgba(240,204,126,.5), inset 0 1px 0 rgba(255,255,255,.6)}
#summonBtn:active{transform:translateY(1px)}
#summonBtn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
/* ------------- SORT / LIST ------------- */
#listHead{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 8px}
#listHead .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
#sortBtn{
  background:transparent;border:1px solid rgba(201,161,90,.4);color:var(--gold);
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .2s;
}
#sortBtn:hover{border-color:var(--gold-bright);color:var(--gold-bright);box-shadow:0 0 10px rgba(201,161,90,.25)}
#taskList{flex:1;overflow-y:auto;padding:6px 20px 20px;scrollbar-width:thin;scrollbar-color:rgba(201,161,90,.4) transparent}
#taskList::-webkit-scrollbar{width:8px}
#taskList::-webkit-scrollbar-thumb{background:rgba(201,161,90,.35);border-radius:4px}
.task{
  position:relative;margin:9px 4px;padding:13px 14px 12px 46px;border-radius:4px;cursor:pointer;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
  border:1px solid rgba(201,161,90,.22);
  transition:border-color .2s, background .2s, transform .15s, box-shadow .25s;
}
.task:hover{border-color:rgba(240,204,126,.55);transform:translateX(2px)}
.task.selected{
  border-color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,161,90,.14), rgba(201,161,90,.05));
  box-shadow:0 0 24px rgba(201,161,90,.22), inset 0 0 18px rgba(201,161,90,.06);
}
.task .sigil{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 0 12px currentColor;
}
.task .tname{font-size:15px;font-weight:600;color:var(--parchment);line-height:1.3}
.task .tmeta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12px;color:rgba(232,220,192,.62)}
.task .tmeta .due{font-family:'Cinzel',serif;letter-spacing:.06em}
.task .tmeta .biome{font-style:italic}
.task .tmeta .overdue{color:#ff7b6b;font-weight:600}
.task .del{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:4px;
  border:1px solid transparent;background:none;color:rgba(232,220,192,.35);cursor:pointer;
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task:hover .del{color:rgba(232,220,192,.7)}
.task .del:hover{color:#ff8a7a;border-color:rgba(255,120,100,.5);background:rgba(120,30,20,.25)}
.task.dying{animation:fadeSlide .8s forwards}
@keyframes fadeSlide{to{opacity:0;transform:translateX(-24px)}}
.empty{padding:34px 10px;text-align:center;color:rgba(232,220,192,.45);font-style:italic;font-size:14px;line-height:1.7}
/* ------------- SCENE OVERLAYS (right) ------------- */
#hud{position:fixed;right:0;top:0;bottom:0;left:min(33.5vw,460px);pointer-events:none;z-index:5}
#creatureName{
  position:absolute;top:34px;left:0;right:0;text-align:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:clamp(18px,2vw,28px);
  letter-spacing:.22em;text-transform:uppercase;color:var(--parchment);
  text-shadow:0 0 24px rgba(0,0,0,.9), 0 0 46px currentColor;opacity:0;transition:opacity .6s;
}
#creatureSub{
  position:absolute;top:calc(34px + clamp(28px,2.8vw,40px));left:0;right:0;text-align:center;
  font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,220,192,.85);
  font-family:'Cinzel',serif;font-weight:700;opacity:0;transition:opacity .6s;
  text-shadow:0 0 16px rgba(0,0,0,.9);
}
.navArrow{
  position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;
  width:52px;height:76px;background:rgba(10,8,16,.45);border:1px solid rgba(201,161,90,.35);
  color:var(--gold);font-size:26px;cursor:pointer;border-radius:4px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(3px);
  font-family:'Cinzel',serif;
}
.navArrow:hover{border-color:var(--gold-bright);color:var(--gold-bright);box-shadow:0 0 20px rgba(201,161,90,.3)}
#prevBtn{left:22px}#nextBtn{right:22px}
/* ------------- SPELL PICKER (square icon) ------------- */
#hud{cursor:crosshair}
#spellPicker{position:absolute;bottom:26px;right:26px;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px;cursor:default}
#spellCurrent{
  width:64px;height:64px;border-radius:10px;cursor:pointer;font-size:30px;
  display:flex;align-items:center;justify-content:center;position:relative;
  border:2px solid rgba(255,255,255,.35);transition:all .18s;
  box-shadow:0 0 22px currentColor, 0 6px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.3);
}
#spellCurrent:hover{transform:translateY(-3px);border-color:#fff}
#spellCurrent .tag{position:absolute;bottom:-18px;right:0;font-size:9px;font-family:'Cinzel',serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,220,192,.6);white-space:nowrap;text-shadow:0 0 6px #000}
#spellMenu{
  display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;
  background:linear-gradient(180deg, rgba(18,13,28,.9), rgba(8,6,14,.95));
  border:1px solid rgba(201,161,90,.4);box-shadow:0 8px 40px rgba(0,0,0,.7);
  opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:all .18s;
}
#spellMenu.open{opacity:1;transform:none;pointer-events:auto}
.spellOpt{
  position:relative;width:52px;height:52px;border-radius:8px;cursor:pointer;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.18);transition:all .15s;
}
.spellOpt:hover{border-color:#fff;transform:scale(1.08);box-shadow:0 0 16px currentColor}
.spellOpt.sel{border-color:#fff;box-shadow:0 0 18px currentColor}
.spellOpt .key{position:absolute;top:2px;left:5px;font-size:9px;font-family:'Cinzel',serif;color:rgba(255,255,255,.85)}
/* ------------- HP + hint ------------- */
#hpwrap{position:absolute;top:calc(34px + clamp(52px,5vw,76px));left:0;right:0;display:flex;justify-content:center;gap:7px;opacity:0;transition:opacity .5s}
.pip{width:15px;height:15px;transform:rotate(45deg);border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.4);transition:all .3s;box-shadow:0 0 8px rgba(0,0,0,.7)}
.pip.on{box-shadow:0 0 12px currentColor;border-color:#fff}
#hint{
  position:absolute;bottom:104px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(232,220,192,.55);text-shadow:0 0 10px #000;transition:opacity .5s;white-space:nowrap;
}
#toast{
  position:absolute;bottom:130px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-bright);text-shadow:0 0 20px rgba(240,204,126,.8);opacity:0;transition:opacity .5s;
  white-space:nowrap;
}
/* ------------- ALTAR RUNE (panel) ------------- */
#runeDock{display:flex;justify-content:center;margin:12px 0 2px}
#panelRune{width:86px;height:86px;color:#8d93a3;transition:color .5s;filter:drop-shadow(0 0 8px currentColor)}
#panelRune svg{width:100%;height:100%;overflow:visible;display:block}
#panelRune .pr1{transform-origin:110px 110px;animation:spinCW 26s linear infinite}
#panelRune .pr2{transform-origin:110px 110px;animation:spinCCW 15s linear infinite}
#panelRune .prc{transform-origin:110px 110px;animation:spinCW 44s linear infinite}
@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
#panelRune.flare{animation:runeFlare .9s ease-out}
@keyframes runeFlare{0%{filter:drop-shadow(0 0 26px currentColor) brightness(2.2);transform:scale(1.1)}100%{filter:drop-shadow(0 0 8px currentColor);transform:scale(1)}}
#muteBtn{position:absolute;top:28px;right:22px;background:none;border:1px solid rgba(201,161,90,.4);color:var(--gold);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px;transition:all .2s;z-index:2}
#muteBtn:hover{border-color:var(--gold-bright);color:var(--gold-bright)}
/* ------------- VANQUISH ------------- */
#vanquishBtn{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);pointer-events:auto;
  font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.2em;text-transform:uppercase;
  padding:15px 36px;border-radius:8px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#8a35e0,#4b1687);border:2px solid #c08aff;
  box-shadow:0 0 26px rgba(139,47,214,.55), 0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35);
  transition:all .2s;
}
#vanquishBtn:hover:not(:disabled){filter:brightness(1.18);box-shadow:0 0 44px rgba(160,80,255,.85), 0 10px 40px rgba(0,0,0,.6)}
#vanquishBtn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(.8)}
/* ------------- CINEMATIC OVERLAY ------------- */
.xpBolt{position:fixed;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:60;
  background:radial-gradient(circle,#fff 0%,#f0cc7e 45%,rgba(240,204,126,0) 75%);
  box-shadow:0 0 18px 4px rgba(240,204,126,.85)}
#xpFill.surge{box-shadow:0 0 18px rgba(240,204,126,1)}
#cinema.kill::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 62% 45%, rgba(255,240,200,.5), transparent 70%);animation:killFlash .5s ease-out forwards}
@keyframes killFlash{0%{opacity:1}100%{opacity:0}}
#cinema{position:fixed;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(120% 90% at 62% 45%, transparent 52%, rgba(0,0,0,.45) 100%)}
#cinema::after{content:"";position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.7'/></svg>")}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<aside id="grimoire">
  <header>
    <h1>Grimoire of Deeds</h1>
    <button id="muteBtn" title="Toggle sound">🔊</button>
    <div class="rule"></div>
    <div id="xpRow"><span id="rankName">Novice</span><span class="xpbar"><i id="xpFill"></i></span><span id="lvlTag">Lv 1</span></div>
  </header>
  <div id="summonForm">
    <div id="runeDock"><div id="panelRune" aria-hidden="true"></div></div>
    <label class="fieldlab" for="taskName">Inscribe a deed</label>
    <input id="taskName" type="text" maxlength="80" placeholder="e.g. Finish the quarterly report…">
    <div class="row2">
      <div>
        <label class="fieldlab" for="taskDue">Due by</label>
        <input id="taskDue" type="date">
      </div>
      <button id="summonBtn" type="button">Summon</button>
    </div>
  </div>
  <div id="listHead">
    <span class="lbl">Bound Creatures</span>
    <button id="sortBtn" type="button">Sort: Due ▾</button>
  </div>
  <div id="taskList"><div class="empty">The grimoire lies empty.<br>Inscribe a deed above to summon its guardian.</div></div>
</aside>

<div id="hud">
  <div id="creatureName"></div>
  <div id="creatureSub"></div>
  <button class="navArrow" id="prevBtn" title="Previous creature">‹</button>
  <button class="navArrow" id="nextBtn" title="Next creature">›</button>
  <div id="toast"></div>
  <div id="hpwrap"></div>
  <div id="hint"></div>
  <button id="vanquishBtn" disabled>✦ Vanquish</button>
  <div id="spellPicker">
    <div id="spellMenu">
      <div class="spellOpt" data-spell="fire"   style="color:var(--fire);background:radial-gradient(circle at 35% 30%, #ffb066, #8a2500)"><span class="key">1</span>🔥</div>
      <div class="spellOpt" data-spell="ice"    style="color:var(--ice);background:radial-gradient(circle at 35% 30%, #bdefff, #0a4a75)"><span class="key">2</span>❄️</div>

<script>

(function(){
"use strict";

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 400);

/* The stage sits to the right of the panel: shift camera target right by
   offsetting the projection so the composition centers in the visible area. */
function panelPx(){ return Math.max(330, Math.min(innerWidth*0.335, 460)); }
function applyViewOffset(){
  const p = panelPx();
  camera.aspect = (innerWidth + p)/innerHeight;
  camera.setViewOffset(innerWidth + p, innerHeight, 0, 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}
applyViewOffset();
camera.position.set(0, 4.9, 17.5);

addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); applyViewOffset(); });

const clock = new THREE.Clock();
let elapsed = 0;

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x1a1020, 0.7); scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xfff2d8, 1.1);
keyLight.position.set(8, 14, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left=-18; keyLight.shadow.camera.right=18;
keyLight.shadow.camera.top=18; keyLight.shadow.camera.bottom=-18;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x7aa8ff, 0.6); rimLight.position.set(-10, 6, -8); scene.add(rimLight);
const runeLight = new THREE.PointLight(0x8d93a3, 0.8, 24, 2); runeLight.position.set(0, 1.2, 0); scene.add(runeLight);

/* ---------- surface detail: mottled bump texture + vertex cragging ---------- */
const bumpTex=(function(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#808080'; g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){
    const v=90+Math.random()*130|0, r=rnd(2,14);
    g.fillStyle='rgba('+v+','+v+','+v+',0.5)';
    g.beginPath(); g.arc(Math.random()*S,Math.random()*S,r,0,6.29); g.fill();
  }
  for(let i=0;i<14000;i++){

/* ---------- generic particle burst system ---------- */
const bursts = [];
function spawnBurst(opts){
  const n = opts.count||120;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3), vel = new Float32Array(n*3), life = new Float32Array(n);
  for(let i=0;i<n;i++){
    pos[i*3]=opts.origin.x; pos[i*3+1]=opts.origin.y; pos[i*3+2]=opts.origin.z;
    const dir = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
    if(opts.up) dir.y = Math.abs(dir.y)*1.4;
    const sp = (opts.speed||4)*(0.35+Math.random()*0.85);
    vel[i*3]=dir.x*sp; vel[i*3+1]=dir.y*sp; vel[i*3+2]=dir.z*sp;
    life[i]=0.6+Math.random()*(opts.life||0.9);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    size:opts.size||0.22, map:glowTex, transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, color:opts.color, opacity:1
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  bursts.push({pts, vel, life, age:0, maxAge:1.7+(opts.life||0.9), gravity:(opts.gravity!==undefined?opts.gravity:-3.5), drag:opts.drag||0.985});
}
function updateBursts(dt){
  for(let b=bursts.length-1;b>=0;b--){
    const B=bursts[b]; B.age+=dt;
    const p=B.pts.geometry.attributes.position.array;
    for(let i=0;i<B.life.length;i++){
      if(B.age>B.life[i]) continue;
      B.vel[i*3]*=B.drag; B.vel[i*3+1]=B.vel[i*3+1]*B.drag + B.gravity*dt; B.vel[i*3+2]*=B.drag;
      p[i*3]+=B.vel[i*3]*dt; p[i*3+1]+=B.vel[i*3+1]*dt; p[i*3+2]+=B.vel[i*3+2]*dt;
    }
    B.pts.geometry.attributes.position.needsUpdate=true;
    B.pts.material.opacity = Math.max(0, 1 - B.age/B.maxAge);
    if(B.age>=B.maxAge){ scene.remove(B.pts); B.pts.geometry.dispose(); B.pts.material.dispose(); bursts.splice(b,1); }
  }
}

let ambient = null;
function setAmbientParticles(cfg){
  if(ambient){ scene.remove(ambient.pts); ambient.pts.geometry.dispose(); ambient.pts.material.dispose(); ambient=null; }
  if(!cfg) return;
  const n=cfg.count, geo=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3), seed=new Float32Array(n);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()*2-1)*30;
    pos[i*3+1]=Math.random()*cfg.height;
    pos[i*3+2]=(Math.random()*2-1)*30;
    seed[i]=Math.random()*Math.PI*2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({size:cfg.size, map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color:cfg.color, opacity:cfg.opacity});
  const pts=new THREE.Points(geo,mat); scene.add(pts);
  ambient={pts, seed, mode:cfg.mode, height:cfg.height, speed:cfg.speed};
}
function updateAmbient(dt){
  if(!ambient) return;
  const p=ambient.pts.geometry.attributes.position.array;
  for(let i=0;i<ambient.seed.length;i++){
    const s=ambient.seed[i];
    if(ambient.mode==='rise'){ p[i*3+1]+=ambient.speed*dt*(0.5+0.5*Math.sin(s)); if(p[i*3+1]>ambient.height) p[i*3+1]=0; p[i*3]+=Math.sin(elapsed*0.7+s)*dt*0.3; }
    else if(ambient.mode==='fall'){ p[i*3+1]-=ambient.speed*dt*(0.5+0.5*Math.sin(s)); if(p[i*3+1]<0) p[i*3+1]=ambient.height; p[i*3]+=Math.sin(elapsed+s)*dt*0.6; }
    else { p[i*3]+=Math.sin(elapsed*0.4+s)*dt*0.5; p[i*3+1]+=Math.cos(elapsed*0.3+s*1.3)*dt*0.35; p[i*3+2]+=Math.sin(elapsed*0.25+s*0.7)*dt*0.4; }
  }
  ambient.pts.geometry.attributes.position.needsUpdate=true;

let sceneryGroup = new THREE.Group(); scene.add(sceneryGroup);
function clearScenery(){
  scene.remove(sceneryGroup);

function rnd(a,b){ return a+Math.random()*(b-a); }
function scatterRing(fn, count, rMin, rMax){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, r=rnd(rMin,rMax);
    const obj=fn(); obj.position.set(Math.cos(a)*r, obj.position.y, Math.sin(a)*r);
    obj.rotation.y=Math.random()*Math.PI*2;

}

/* distant silhouette peaks around the horizon */
function mountains(color, n){
  const m=new THREE.MeshBasicMaterial({color});

const lerpState = {
  fogColor:new THREE.Color(0x0b0910), groundColor:new THREE.Color(0x2a3a2a),
  hemiSky:new THREE.Color(0xbfd4ff), hemiGround:new THREE.Color(0x1a1020),

let biomeTarget = null;
function setBiome(key){
  const B=BIOMES[key];
  biomeTarget = {
    fogColor:new THREE.Color(B.fog), groundColor:new THREE.Color(B.ground),
    hemiSky:new THREE.Color(B.hemi[0]), hemiGround:new THREE.Color(B.hemi[1]),
    keyColor:new THREE.Color(B.key[0]),
    fogNear:B.fogNear, fogFar:B.fogFar, hemiInt:B.hemi[2], keyInt:B.key[1], rimInt:B.rim[1]
  };
  rimLight.color.set(B.rim[0]);
  skyMat.map = makeSkyTexture(B.sky[0],B.sky[1],B.sky[2]); skyMat.needsUpdate=true;
  if(sunSprite){
    if(B.sun){ sunSprite.material.color.set(B.sun.color); sunSprite.position.set(B.sun.pos[0],B.sun.pos[1],B.sun.pos[2]); sunSprite.scale.set(B.sun.scale,B.sun.scale,1); sunSprite.material.opacity=0.8; }
    else sunSprite.material.opacity=0;
  }
  clearScenery(); B.build();
  sceneryGroup.traverse(o=>{
    if(o.isMesh && o.material && o.material.isMeshStandardMaterial && !o.material.bumpMap && !o.material.transparent){
      o.material.bumpMap=bumpTex; o.material.bumpScale=0.22; o.material.needsUpdate=true;
    }
  });
  setAmbientParticles(B.ambient);
}
function updateBiomeLerp(dt){
  if(!biomeTarget) return;
  const k = 1 - Math.pow(0.02, dt); // smooth exp lerp
  lerpState.fogColor.lerp(biomeTarget.fogColor,k);
  lerpState.groundColor.lerp(biomeTarget.groundColor,k);
  lerpState.hemiSky.lerp(biomeTarget.hemiSky,k);
  lerpState.hemiGround.lerp(biomeTarget.hemiGround,k);
  lerpState.keyColor.lerp(biomeTarget.keyColor,k);
  lerpState.fogNear += (biomeTarget.fogNear-lerpState.fogNear)*k;
  lerpState.fogFar  += (biomeTarget.fogFar -lerpState.fogFar)*k;
  lerpState.hemiInt += (biomeTarget.hemiInt-lerpState.hemiInt)*k;
  lerpState.keyInt  += (biomeTarget.keyInt -lerpState.keyInt)*k;
  lerpState.rimInt  += (biomeTarget.rimInt -lerpState.rimInt)*k;
  scene.fog.color.copy(lerpState.fogColor);
  scene.fog.near=lerpState.fogNear; scene.fog.far=lerpState.fogFar;
  groundMat.color.copy(lerpState.groundColor);
  hemi.color.copy(lerpState.hemiSky); hemi.groundColor.copy(lerpState.hemiGround); hemi.intensity=lerpState.hemiInt;
  keyLight.color.copy(lerpState.keyColor); keyLight.intensity=lerpState.keyInt;
  rimLight.intensity=lerpState.rimInt;
}

function spawnSmoke(at, count, dark, color, sink){
  for(let i=0;i<count;i++){

    const s=new THREE.Sprite(m);

    addRunner(dt=>{

/* expanding shockwave ring */
function shockRing(at, color, maxR, dur, tilt){
  const m=new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.1,16,96),m);
  r.position.copy(at); r.rotation.x=tilt!==undefined?tilt:Math.PI/2;
  scene.add(r);
  let t=0;
  addRunner(dt=>{
    t+=dt; const u=Math.min(1,t/dur), e=easeOutCubic(u);
    r.scale.setScalar(1+e*maxR); m.opacity=0.95*(1-u);
    if(u>=1){ scene.remove(r); r.geometry.dispose(); m.dispose(); return true; }
    return false;
  });
}

function boltFX(from, to, color, width, dur){
  const pts=[]; let p=from.clone(); const n=8;
  for(let i=0;i<n;i++){ pts.push(p.clone()); p=p.clone().lerp(to,1/(n-i)).add(new THREE.Vector3(rnd(-0.6,0.6),rnd(-0.3,0.3),rnd(-0.6,0.6))); }
  pts.push(to.clone());
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.LineBasicMaterial({color, transparent:true, opacity:1, linewidth:width||1});
  const line=new THREE.Line(geo,m); scene.add(line);
  let t=0;
  addRunner(dt=>{ t+=dt; m.opacity=1-t/(dur||0.25);
    if(t>=(dur||0.25)){ scene.remove(line); geo.dispose(); m.dispose(); return true; } return false; });
}

/* =====================================================================
   SPELL DEFINITIONS — real 3D projectiles, one per school
   ===================================================================== */
const SPELLS = {
  fire:  {color:0xdd2a08, mid:0xff8a1a, hot:0xffd8a0, name:'Pyroclasm',  icon:'🔥'},
  ice:   {color:0x2a8ae0, mid:0x7fd4ff, hot:0xeaffff, name:'Glacier',    icon:'❄️'},
  storm: {color:0x7a4de8, mid:0xbfa0ff, hot:0xffffff, name:'Tempest',    icon:'⚡'},
  dark:  {color:0x4a0e8a, mid:0x9a4de8, hot:0xc8f088, name:'Voidgrasp',  icon:'💀'},
  arcane:{color:0x1f4ae0, mid:0x6f9aff, hot:0xdce8ff, name:'Starfall',   icon:'✨'},
  nature:{color:0x1f8a1f, mid:0x59d64a, hot:0xc8ffa0, name:'Verdance',   icon:'🌿'}
};
/* creatures of a realm shrug off its own magic */
const IMMUNE={meadow:'nature', dark:'dark', ocean:'ice', astral:'arcane'};

/* ----- impact flourishes, one per school (big & distinct) ----- */
function impactFX(spell, at){
  const S=SPELLS[spell];
  const fl=new THREE.PointLight(S.hot, 7, 26, 2); fl.position.copy(at).add(new THREE.Vector3(0,0.6,0)); scene.add(fl);
  tween(0.6,u=>{ fl.intensity=7*(1-u); }).then(()=>scene.remove(fl));
  shake(0.5);

  if(spell==='fire'){
    // fireball explosion: hot flash sphere -> shockwave -> embers -> smoke -> scorch
    const boom=new THREE.Mesh(new THREE.SphereGeometry(0.5,36,26),
      new THREE.MeshBasicMaterial({color:0xffc060, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false}));
    boom.position.copy(at); scene.add(boom);
    tween(0.45,u=>{ boom.scale.setScalar(1+easeOutCubic(u)*6.5); boom.material.opacity=0.95*(1-u); })
      .then(()=>{ scene.remove(boom); boom.geometry.dispose(); boom.material.dispose(); });
    shockRing(new THREE.Vector3(at.x,0.15,at.z),0xff6a12,9,0.6);
    spawnBurst({origin:at,count:120,speed:8,size:0.26,color:0xdd2a08,life:1.0,gravity:2.2,up:true});
    spawnBurst({origin:at,count:120,speed:6.5,size:0.24,color:0xff8a1a,life:0.9,gravity:2.0,up:true});
    spawnBurst({origin:at,count:70,speed:4,size:0.32,color:0xffd070,life:0.6,gravity:1.4,up:true});
    spawnSmoke(at,8,true);
    spawnFlame(new THREE.Vector3(at.x,0.3,at.z),14);
    /* roaring fire pillar */
    const pillar=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.7,6.5,32,1,true),
      new THREE.MeshBasicMaterial({color:0xff8a2a, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
    pillar.position.set(at.x,3.2,at.z); scene.add(pillar);
    let pt=0;
    addRunner(dt=>{
      pt+=dt; pillar.scale.x=pillar.scale.z=1+Math.sin(elapsed*30)*0.08;
      pillar.scale.y=1+pt*0.7; pillar.material.opacity=0.55*Math.max(0,1-pt/0.55);
      if(Math.random()<0.8) spawnFlame(new THREE.Vector3(at.x+rnd(-0.8,0.8),rnd(0.5,4),at.z+rnd(-0.8,0.8)),1);
      if(pt>=0.55){ scene.remove(pillar); pillar.geometry.dispose(); pillar.material.dispose(); return true; }
      return false;
    });
    groundDecal(at,0x120a08,2.4,4.5,false);
  }
  if(spell==='ice'){
    shockRing(new THREE.Vector3(at.x,0.15,at.z),0x8ae0ff,7,0.55);
    groundDecal(at,0x9fd8ef,3.0,4.0,false);
    spawnBurst({origin:at,count:130,speed:6,size:0.2,color:0xbdefff,life:0.8,gravity:-5});
    spawnBurst({origin:at,count:70,speed:2.2,size:0.26,color:0xeafcff,life:1.2,gravity:-0.4});
    /* a freezing fog bank rolls out and hangs in the air */
    spawnSmoke(at,12,false,0xcfeeff,true);
    spawnSmoke(new THREE.Vector3(at.x,0.6,at.z),8,false,0xdff4ff,false);
    const cold=new THREE.PointLight(0x9fe0ff,2.4,14,2); cold.position.set(at.x,1.4,at.z); scene.add(cold);
    tween(2.0,u=>{ cold.intensity=2.4*(1-u); }).then(()=>scene.remove(cold));
    for(let i=0;i<10;i++){
      const sh=new THREE.Mesh(new THREE.ConeGeometry(rnd(0.14,0.34),rnd(0.8,2.2),7),
        new THREE.MeshPhysicalMaterial({color:0x9fdfff,transparent:true,opacity:0.92,roughness:0.04,metalness:0.05,clearcoat:1,clearcoatRoughness:0.1,emissive:0x1a7ad0,emissiveIntensity:0.7}));
      const a=Math.random()*Math.PI*2, r=rnd(0.4,2.0);
      sh.position.set(at.x+Math.cos(a)*r,0,at.z+Math.sin(a)*r);
      sh.rotation.set(rnd(-0.35,0.35),rnd(0,3),rnd(-0.35,0.35));
      sh.scale.setScalar(0.01); scene.add(sh);
      (async()=>{ await tween(0.22,u=>sh.scale.setScalar(u),easeOutBack);
        await wait(1.4);
        await tween(0.6,u=>{ sh.material.opacity=0.9*(1-u); sh.position.y=-u*0.8; });
        scene.remove(sh); sh.geometry.dispose(); sh.material.dispose(); })();
    }
  }
  if(spell==='storm'){
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        const top=at.clone().add(new THREE.Vector3(rnd(-2,2),13,rnd(-2,2)));
        const hit=at.clone().add(new THREE.Vector3(rnd(-0.8,0.8),0,rnd(-0.8,0.8)));
        boltFX(top,hit,0xeee4ff,2,0.3);
        boltFX(top,hit,0xb18cff,1,0.35);
        spawnBurst({origin:hit,count:60,speed:5,size:0.16,color:0xd8c8ff,life:0.5,gravity:-3});
        shake(0.3);
      }, i*120);
    }
    // lingering ground arcs
    let t=0;
    addRunner(dt=>{
      t+=dt;
      if(Math.random()<0.5){
        const a=Math.random()*Math.PI*2, r=rnd(0.4,2.2);
        const p1=new THREE.Vector3(at.x+Math.cos(a)*r,0.15,at.z+Math.sin(a)*r);
        const p2=p1.clone().add(new THREE.Vector3(rnd(-1,1),rnd(0.1,0.7),rnd(-1,1)));
        boltFX(p1,p2,0xd8c8ff,1,0.15);
      }
      return t>0.8;
    });
    shockRing(new THREE.Vector3(at.x,0.15,at.z),0xb18cff,6,0.5);
  }
  if(spell==='dark'){
    /* no detonation — the shadow bursts into creeping haze and curling wisps */
    spawnSmoke(at,10,false,0x2a1042,false);
    spawnSmoke(at,6,false,0x431a70,true);
    spawnBurst({origin:at,count:90,speed:3.2,size:0.2,color:0x8a3ae0,life:1.1,gravity:-0.6});
    spawnBurst({origin:at,count:50,speed:2,size:0.16,color:0x8fd86a,life:0.9,gravity:0.6,up:true});
    for(let i=0;i<6;i++){
      const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:i%2?0x5a1f9a:0x6ab852,transparent:true,opacity:0.6,depthWrite:false}));
      const sc=rnd(0.8,1.5); s.scale.set(sc*0.7,sc,1);
      s.position.set(at.x+rnd(-0.8,0.8),at.y+rnd(-0.3,0.3),at.z+rnd(-0.8,0.8));
      scene.add(s);
      const ph=Math.random()*6.28; let tt=0; const dur=rnd(1.2,1.9);
      addRunner(dt=>{
        tt+=dt;
        s.position.y+=dt*1.1;
        s.position.x+=Math.sin(elapsed*3+ph)*dt*0.8;
        const k=Math.max(0,1-tt/dur);
        s.material.opacity=0.6*k; s.scale.set(sc*0.7*(1+tt),sc*(1+tt*1.3),1);
        if(tt>=dur){ scene.remove(s); s.material.dispose(); return true; }
        return false;
      });
    }
    groundDecal(at,0x12061f,3.4,3.2,false);
    shockRing(new THREE.Vector3(at.x,0.12,at.z),0x6a2ab0,5,0.8);
    shake(0.3);
  }
  if(spell==='arcane'){
    groundDecal(at,0x5a8aff,3.4,2.6,true); // spinning rune circle
    shockRing(new THREE.Vector3(at.x,0.15,at.z),0x9dbcff,8,0.7);
    spawnBurst({origin:at,count:120,speed:6,size:0.18,color:0x9dbcff,life:0.8,gravity:-2});
    spawnBurst({origin:new THREE.Vector3(at.x,0.4,at.z),count:60,speed:3.5,size:0.2,color:0xbcd8ff,life:0.8,gravity:-2});
  }
}

/* =====================================================================
   MONSTER BUILDERS
   ===================================================================== */
function mat(color, opts){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.5, metalness:0.15}, opts||{})); }
function emis(color, intensity){ return new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:intensity||1.4, roughness:0.3}); }
function eyePair(parent, color, x, y, z, r){
  /* real eyes: ivory sclera, glowing iris, dark pupil — pupils TRACK targets */
  const R=r||0.09;
  const scleraM=new THREE.MeshStandardMaterial({color:0xf2eee2, roughness:0.3});
  for(const sx of [-1,1]){
    const eye=new THREE.Group(); eye.position.set(sx*x,y,z);
    const sclera=new THREE.Mesh(new THREE.SphereGeometry(R,18,14),scleraM);
    const iris=new THREE.Mesh(new THREE.SphereGeometry(R*0.56,16,12),emis(color,1.3)); iris.position.z=R*0.55;
    const pupil=new THREE.Mesh(new THREE.SphereGeometry(R*0.27,12,10),new THREE.MeshStandardMaterial({color:0x08080d,roughness:0.25}));
    pupil.position.z=R*0.84;
    eye.add(sclera,iris,pupil);
    eye.userData.isEye=true; eye.userData.pupil=pupil; eye.userData.iris=iris; eye.userData.eyeR=R;
    parent.add(eye);
  }
}
function orbitShards(g, color, count, radius, y, size){
  const shardMat=emis(color,1.1);
  const holder=new THREE.Group(); holder.position.y=y; holder.userData.orbit=true;
  for(let i=0;i<count;i++){
    const s=new THREE.Mesh(new THREE.TetrahedronGeometry(size||0.18,0),shardMat);
    const a=i/count*Math.PI*2;
    s.position.set(Math.cos(a)*radius,Math.sin(i*2.3)*0.25,Math.sin(a)*radius);
    s.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
    holder.add(s);
  }
  g.add(holder); return holder;
}
/* a limb segment that ALWAYS connects: cylinder from a to b + a joint sphere at b */
function limb(g, m, a, b, r1, r2){
  const dir=b.clone().sub(a), len=dir.length();
  const c=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,12), m);

function prepMonster(g){
  const original=[];
  g.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;
      if(o.material && !Array.isArray(o.material)){
        original.push({m:o.material, color:o.material.color?o.material.color.clone():null,
          emissive:o.material.emissive?o.material.emissive.clone():null});
      }
    }
  });
  g.userData.originalMats=original;
  g.userData.baseScale=g.scale.x||1;
  return g;
}

/* =====================================================================
   SEQUENCER UTILITIES
   ===================================================================== */
const runners=[];
function addRunner(fn){ runners.push(fn); }
function updateRunners(dt){
  for(let i=runners.length-1;i>=0;i--){ try{ if(runners[i](dt)) runners.splice(i,1); }catch(e){ runners.splice(i,1); } }
}
function wait(sec){ return new Promise(res=>{ let t=0; addRunner(dt=>{ t+=dt; if(t>=sec){res(); return true;} return false; }); }); }
function tween(sec, fn, ease){ return new Promise(res=>{ let t=0; addRunner(dt=>{ t+=dt; let u=Math.min(1,t/sec); if(ease)u=ease(u); fn(u); if(t>=sec){res(); return true;} return false; }); }); }
const easeOutBack = u=>{ const c=1.5; return 1 + (c+1)*Math.pow(u-1,3) + c*Math.pow(u-1,2); };
const easeOutCubic = u=>1-Math.pow(1-u,3);
const easeInCubic = u=>u*u*u;
let shakeAmt=0;
function shake(a){ shakeAmt=Math.max(shakeAmt,a); }

function summonPillar(color){
  const geo=new THREE.CylinderGeometry(2.2,2.9,14,40,1,true);
  const m=new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false});
  const p=new THREE.Mesh(geo,m); p.position.y=7; scene.add(p);
  (async()=>{
    await tween(0.35,u=>{ m.opacity=u*0.5; p.scale.set(1-u*0.3,1,1-u*0.3); });
    await tween(0.9,u=>{ m.opacity=0.5*(1-u); p.scale.set(0.7+u*0.6,1+u*0.2,0.7+u*0.6); });
    scene.remove(p); geo.dispose(); m.dispose();
  })();
}

  els.toast.style.color=color||'var(--gold-bright)';
  els.toast.style.opacity=1;
  clearTimeout(toast._t); toast._t=setTimeout(()=>els.toast.style.opacity=0,2400);
}
function fmtDue(d){
  if(!d) return 'No due date';
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function isOverdue(d){
  if(!d) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  return new Date(d+'T00:00:00') < today;
}
function sortedTasks(){
  return tasks.slice().sort((a,b)=>{
    const av=a.due?new Date(a.due).getTime():Infinity;
    const bv=b.due?new Date(b.due).getTime():Infinity;
    return sortAsc? av-bv : bv-av;
  });
}
function renderList(){
  const arr=sortedTasks();
  els.list.innerHTML='';
  if(!arr.length){
    els.list.innerHTML='<div class="empty">The grimoire lies empty.<br>Inscribe a deed above to summon its guardian.</div>';
    return;
  }
  for(const t of arr){
    const d=document.createElement('div');
    d.className='task'+(t.id===selectedId?' selected':'');
    d.dataset.id=t.id;
    const overdue=isOverdue(t.due);
    d.innerHTML=
      '<div class="sigil" style="color:'+BIOME_TINT[t.biome]+'">'+BIOME_ICON[t.biome]+'</div>'+
      '<div class="tname"></div>'+
      '<div class="tmeta"><span class="due'+(overdue?' overdue':'')+'">'+(overdue?'⚠ ':'')+fmtDue(t.due)+'</span>'+
      '<span class="biome">'+t.monsterName+' · '+BIOMES[t.biome].label+'</span></div>'+
      '<button class="del" title="Banish this deed (delete)">✕</button>';
    d.querySelector('.tname').textContent=t.name;
    d.addEventListener('click',()=>{ if(!busy && t.id!==selectedId) selectTask(t.id,true); });
    d.querySelector('.del').addEventListener('click',e=>{ e.stopPropagation(); banishTask(t.id); });
    els.list.appendChild(d);
  }
}
function renderHP(){
  els.hp.innerHTML='';
  if(!mob.alive){ els.hp.style.opacity=0; return; }
  const t=tasks.find(x=>x.id===selectedId);
  const tint=t?BIOME_TINT[t.biome]:'#fff';
  for(let i=0;i<mob.maxHp;i++){
    const p=document.createElement('div');
    p.className='pip'+(i<mob.hp?' on':'');
    p.style.color=tint;
    if(i<mob.hp) p.style.background=tint;
    els.hp.appendChild(p);
  }
  els.hp.style.opacity=1;
}
function updateHUD(){
  const t=tasks.find(x=>x.id===selectedId);
  if(t){
    els.cName.textContent=t.monsterName;
    els.cName.style.color=BIOME_TINT[t.biome];
    els.cSub.textContent=t.name+(t.due?(' · due '+fmtDue(t.due)):'');
    els.cSub.style.color=SUB_TINT[t.biome]||'rgba(232,220,192,.85)';
    els.cName.style.opacity=1; els.cSub.style.opacity=1;
    els.hint.textContent = mob.alive ? 'Click anywhere — a portal strikes the beast · 1–5 spells' : '';
    els.hint.style.opacity = mob.alive?1:0;
  } else {
    els.cName.style.opacity=0; els.cSub.style.opacity=0;
    els.hint.style.opacity=0;
  }
  els.vanquish.disabled = !(mob.alive && !busy && !finishing);
  renderHP();
}

/* ---------- the creature drags a patch of its home world through the rune ---------- */
let patchGroup=null;
function clearPatch(instant){
  if(!patchGroup) return;
  const pg=patchGroup; patchGroup=null;
  const kill=()=>{ scene.remove(pg); pg.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material){Array.isArray(o.material)?o.material.forEach(x=>x.dispose()):o.material.dispose();} }); };
  if(instant){ kill(); return; }
  tween(0.6,u=>{ pg.scale.setScalar(Math.max(0.001,1-u)); pg.position.y=-u*0.8; }).then(kill);
}
function spawnPatch(biome){
  clearPatch();
  const pg=new THREE.Group(); patchGroup=pg; scene.add(pg);
  const props=[];
  const put=(obj,r0,r1)=>{
    const a=Math.random()*Math.PI*2, r=rnd(r0,r1);
    obj.position.x=Math.cos(a)*r; obj.position.z=Math.sin(a)*r;
    obj.rotation.y=Math.random()*Math.PI*2;
    obj.userData.grow=obj.scale.x; obj.scale.setScalar(0.001);
    pg.add(obj); props.push(obj);
  };
  if(biome==='meadow'){
    for(let i=0;i<16;i++){ // grass tufts
      const tuft=new THREE.Group();
      const gm=new THREE.MeshStandardMaterial({color:0x4a8a3c,roughness:0.9});
      for(let k=0;k<5;k++){
        const bl=new THREE.Mesh(new THREE.ConeGeometry(0.045,rnd(0.5,0.9),4),gm);
        bl.position.set(rnd(-0.15,0.15),bl.geometry.parameters.height/2,rnd(-0.15,0.15));
        bl.rotation.set(rnd(-0.3,0.3),0,rnd(-0.3,0.3)); tuft.add(bl);
      }
      put(tuft,3.4,5.4);
    }
    for(let i=0;i<8;i++){ // wildflowers
      const f=new THREE.Group();
      const st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.55,4),new THREE.MeshStandardMaterial({color:0x4a7a3c}));
      st.position.y=0.28; f.add(st);
      const bl=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),emis([0xffe066,0xff8fb0,0xc9a2ff][i%3],0.7));
      bl.position.y=0.58; f.add(bl);
      put(f,3.2,5.2);
    }
    for(let i=0;i<7;i++){ // red-and-white polka-dot toadstools spring up
      const mu=new THREE.Group();
      const stalk=new THREE.Mesh(new THREE.CylinderGeometry(rnd(0.05,0.08),rnd(0.08,0.11),rnd(0.3,0.55),10),
        new THREE.MeshStandardMaterial({color:0xefe6d0,roughness:0.9}));
      stalk.position.y=stalk.geometry.parameters.height/2; mu.add(stalk);
      const capR=rnd(0.22,0.4);
      const mcap=new THREE.Mesh(new THREE.SphereGeometry(capR,18,14,0,Math.PI*2,0,Math.PI*0.55),
        new THREE.MeshPhysicalMaterial({color:0xc42418,roughness:0.35,clearcoat:0.8,clearcoatRoughness:0.3}));
      mcap.position.y=stalk.geometry.parameters.height; mcap.scale.y=0.75; mu.add(mcap);
      for(let k=0;k<5;k++){
        const th=Math.random()*Math.PI*2, ph=rnd(0.15,0.42)*Math.PI;
        const dot=new THREE.Mesh(new THREE.SphereGeometry(capR*0.16,10,8),
          new THREE.MeshStandardMaterial({color:0xf4ecd8,roughness:0.85}));
        dot.position.set(Math.sin(ph)*Math.cos(th)*capR, mcap.position.y+Math.cos(ph)*capR*0.75, Math.sin(ph)*Math.sin(th)*capR);
        dot.scale.y=0.5; mu.add(dot);
      }
      put(mu,3.2,5.4);
    }
    for(let i=0;i<3;i++){ // saplings
      const s=new THREE.Group();
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.13,1.4,7),new THREE.MeshStandardMaterial({color:0x5a4330,roughness:1}));
      tr.position.y=0.7; s.add(tr);
      const fol=new THREE.Mesh(new THREE.IcosahedronGeometry(0.65,1),new THREE.MeshStandardMaterial({color:0x3f7a33,roughness:0.9}));
      fol.position.y=1.7; fol.castShadow=true; s.add(fol);
      put(s,4.4,5.8);
    }
    pg.userData.motes=0x9dff6a;
  }
  if(biome==='ocean'){
    // a shallow pool of otherworldly water around the rune
    const pool=new THREE.Mesh(new THREE.RingGeometry(3.0,6.0,48),
      new THREE.MeshStandardMaterial({color:0x1a8aa8, transparent:true, opacity:0.55, roughness:0.1, metalness:0.4, emissive:0x0a4a5a, emissiveIntensity:0.5, side:THREE.DoubleSide}));
    pool.rotation.x=-Math.PI/2; pool.position.y=0.05; pool.userData.grow=1; pool.scale.setScalar(0.001);
    pool.userData.water=true; pg.add(pool); props.push(pool);
    const coralCols=[0xff6f91,0xffb26b,0x9b5de5,0x00bbf9];
    for(let i=0;i<9;i++){
      const cg=new THREE.Group();
      const col=coralCols[i%coralCols.length];
      const cm=new THREE.MeshStandardMaterial({color:col,roughness:0.6,emissive:col,emissiveIntensity:0.18});
      for(let k=0;k<4;k++){
        const br=new THREE.Mesh(new THREE.ConeGeometry(rnd(0.08,0.18),rnd(0.5,1.3),5),cm);
        br.position.set(rnd(-0.3,0.3),br.geometry.parameters.height/2,rnd(-0.3,0.3));
        br.rotation.set(rnd(-0.4,0.4),0,rnd(-0.4,0.4)); cg.add(br);
      }
      put(cg,3.4,5.6);
    }
    for(let i=0;i<5;i++){
      const kelp=new THREE.Group();
      const km=new THREE.MeshStandardMaterial({color:0x1a8a55,roughness:0.8});
      const h=rnd(1.6,2.8);
      for(let k=0;k<4;k++){
        const s2=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.065,h/4,5),km);
        s2.position.y=h/8+k*h/4; kelp.add(s2);
      }
      kelp.userData.sway=Math.random()*6.28; kelp.userData.isKelp=true;
      put(kelp,3.6,5.4);
    }
    pg.userData.motes=0x5affd8; pg.userData.bubbles=true;
  }
  if(biome==='dark'){
    for(let i=0;i<8;i++){ // obsidian shards
      const h=rnd(0.8,2.2);
      const sp=new THREE.Mesh(crag(new THREE.ConeGeometry(rnd(0.16,0.34),h,8,3),0.06),
        new THREE.MeshStandardMaterial({color:0x241a30,roughness:0.5,metalness:0.4,bumpMap:bumpTex,bumpScale:0.25}));
      sp.position.y=h/2; sp.rotation.z=rnd(-0.25,0.25); sp.castShadow=true;
      put(sp,3.4,5.6);
    }
    for(let i=0;i<6;i++){ // glowing magma fissures
      const fis=new THREE.Mesh(new THREE.SphereGeometry(rnd(0.35,0.7),12,8),emis(0xff4d1a,1.2));
      fis.scale.y=0.12; fis.position.y=0.05;
      put(fis,3.2,5.6);
    }
    pg.userData.motes=0xff5a2a;
  }
  if(biome==='astral'){
    for(let i=0;i<10;i++){ // starlit crystal shards
      const cr=new THREE.Mesh(new THREE.OctahedronGeometry(rnd(0.25,0.6),0),
        new THREE.MeshPhysicalMaterial({color:0xbfd0ff,roughness:0.1,metalness:0.2,clearcoat:1,emissive:0x3a5ad0,emissiveIntensity:0.7,transparent:true,opacity:0.95}));
      cr.scale.y=rnd(1.6,2.6); cr.position.y=cr.scale.y*0.4;
      put(cr,3.3,5.6);
    }
    for(let i=0;i<3;i++){ // little captive moons drifting over the circle
      const moon=new THREE.Mesh(new THREE.SphereGeometry(rnd(0.2,0.32),18,14),emis(0xe8eeff,1.1));
      moon.position.y=rnd(2.2,3.4); moon.userData.isFloat=Math.random()*6.28;
      put(moon,3.6,5.2);
    }
    pg.userData.motes=0x9fb8ff;
  }
  // staggered eruption from the earth
  props.forEach((o,i)=>{
    setTimeout(()=>{
      spawnBurst({origin:new THREE.Vector3(o.position.x,0.2,o.position.z),count:14,speed:2,size:0.13,color:pg.userData.motes,life:0.5,gravity:2,up:true});
      tween(0.4,u=>{ o.scale.setScalar(Math.max(0.001,u*o.userData.grow)); },easeOutBack);
    }, 220+i*45);
  });
}

function disposeMonster(){
  clearBarrier();
  if(!currentMonster) return;
  scene.remove(currentMonster);
  currentMonster.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material){Array.isArray(o.material)?o.material.forEach(m=>m.dispose()):o.material.dispose();} });
  currentMonster=null; mob.alive=false;
}

/* banish: strike a deed from the grimoire without battle (no experience) */
async function banishTask(id){
  if(busy) return;
  sfx.ui();
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  const el=els.list.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add('dying');
  if(id===selectedId && currentMonster){
    busy=true; mob.alive=false; clearBarrier(false); updateHUD();
    // the creature is unsummoned: dragged back down through the rune
    sfx.portal();
    const m=currentMonster;
    spawnBurst({origin:m.position.clone().add(new THREE.Vector3(0,2,0)),count:90,speed:-4,size:0.16,color:0x8d93a3,life:0.5,gravity:0,drag:1});
    const bs=m.userData.baseScale||1;
    await tween(0.55,u=>{ m.scale.setScalar(Math.max(0.001,(1-u)*bs)); m.position.y=-u*1.4; m.rotation.y+=0.12; },easeInCubic);
    disposeMonster(); clearPatch();
    busy=false;
  }
  const i=tasks.indexOf(t); if(i>=0) tasks.splice(i,1);
  toast('THE DEED IS STRUCK FROM THE GRIMOIRE');
  if(id===selectedId){
    const arr=sortedTasks();
    if(arr.length){ selectTask(arr[0].id,true); }
    else {
      selectedId=null; renderList(); updateHUD();
      runeTargetColor.copy(RUNE_GREY); runeIntensityTarget=0;
      runeLight.color.copy(RUNE_GREY);
    }
  } else { renderList(); }
}

/* ---------- summoning ---------- */
async function summonSequence(task, grand){
  busy=true; els.summon.disabled=true; mob.alive=false; updateHUD();
  /* the Realm of Shadow endures — only the creature and its home patch arrive */
  spawnPatch(task.biome);
  const tint=new THREE.Color(BIOME_TINT[task.biome]);
  runeTargetColor.copy(tint); runeIntensityTarget=1;
  monsterGlow.material.color.copy(tint);
  disposeMonster();

  flarePanelRune();
  sfx.summon();
  await wait(grand?0.5:0.25);
  summonPillar(tint.getHex());
  spawnBurst({origin:new THREE.Vector3(0,0.3,0),count:grand?220:120,speed:6,size:0.24,color:tint.getHex(),life:1.0,gravity:2.5,up:true});
  runeLight.color.copy(tint); runeLight.intensity=3.2;
  shake(grand?0.45:0.25);

  const m=prepMonster(MonsterFactory[task.kind]());
  m.position.set(0,0,0); m.scale.setScalar(0.001);
  currentMonster=m; scene.add(m);
  const bs=m.userData.baseScale||1;
  await tween(grand?0.9:0.6,u=>{ m.scale.setScalar(Math.max(0.001,u*bs)); }, easeOutBack);
  // landing: dust kicks out along the ground as the beast arrives
  shockRing(new THREE.Vector3(0,0.12,0), tint.getHex(), 5, 0.5);
  spawnSmoke(new THREE.Vector3(0,0.3,0),5,true);
  spawnBurst({origin:new THREE.Vector3(0,1.5,0),count:60,speed:3,size:0.16,color:tint.getHex(),life:0.6,gravity:-1});
  shake(0.28);
  runeIntensityTarget=0.55;

  // arm the combat blackboard: 3–5 strikes to fell
  mob.alive=true;
  mob.maxHp = 5;
  mob.hp = mob.maxHp;
  mob.hitR = m.userData.hitR||2.0;
  mob.biome=task.biome;
  mob.home.set(0,0,0); mob.wp.set(0,0,0); mob.wpTimer=0;
  mob.dodge=null; mob.barrier=null; mob.face=null; mob.flash=0;
  busy=false; els.summon.disabled=false; updateHUD();
}

function selectTask(id, resummon){
  selectedId=id; renderList(); updateHUD();
  const t=tasks.find(x=>x.id===id);
  if(t && resummon) summonSequence(t,false);
  if(!t){ disposeMonster(); runeTargetColor.copy(RUNE_GREY); runeIntensityTarget=0; updateHUD(); }
}
function step(dir){
  if(busy||!tasks.length) return;
  const arr=sortedTasks();
  let idx=arr.findIndex(t=>t.id===selectedId);
  idx=(idx+dir+arr.length)%arr.length;
  selectTask(arr[idx].id,true);
}

/* ---------- monster shield (elemental, absorbs one hit) ---------- */
let finishing=false;
/* the beast snaps up a great rune barrier that DEFLECTS the incoming spell */
function raiseBarrier(towardPoint){
  if(mob.barrier||!currentMonster||!mob.alive||finishing) return;
  const col=currentMonster.userData.eye||0x88aaff;
  const g=new THREE.Group(); scene.add(g);
  const disc=new THREE.Mesh(new THREE.PlaneGeometry(4.6,4.6),
    new THREE.MeshBasicMaterial({map:runeTex, color:col, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  const disc2=new THREE.Mesh(new THREE.PlaneGeometry(5.8,5.8),
    new THREE.MeshBasicMaterial({map:runeTex, color:col, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,0.06,14,90),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false}));
  const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  gl.scale.set(7,7,1);
  g.add(disc,disc2,ring,gl);
  g.scale.setScalar(0.01);
  tween(0.16,u=>g.scale.setScalar(u),easeOutBack);
  mob.barrier={group:g, disc, disc2, ring, toward:towardPoint.clone()};
  sfx.shieldUp();
  toast(currentTaskName()+' CASTS A DEFLECTION RUNE', '#'+new THREE.Color(col).getHexString());
}
function clearBarrier(shatter, hitPoint){
  if(!mob.barrier) return;
  const b=mob.barrier; mob.barrier=null;
  const col=b.disc.material.color.getHex();
  if(shatter){
    sfx.deflect();
    const at=hitPoint||b.group.position;
    spawnBurst({origin:at.clone(),count:110,speed:6,size:0.17,color:col,life:0.6,gravity:-1});
    spawnBurst({origin:at.clone(),count:50,speed:3,size:0.22,color:0xffffff,life:0.4,gravity:0});
    shockRing(b.group.position.clone(), col, 4, 0.4, b.group.rotation.x);
    shake(0.3);
    tween(0.28,u=>{ b.group.scale.setScalar(1+u*0.5); b.disc.material.opacity=0.95*(1-u); b.disc2.material.opacity=0.35*(1-u); b.ring.material.opacity=0.7*(1-u); }).then(()=>{
      scene.remove(b.group);
      b.group.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
    });
    return;
  }
  scene.remove(b.group);
  b.group.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
}
/* cosmetic counterattack: the beast hurls a bolt back at your portal */
function counterBolt(to){
  if(!currentMonster||!mob.alive) return;
  sfx.counter();
  const col=currentMonster.userData.eye||0x8b2fd6;
  const from=currentMonster.position.clone().add(new THREE.Vector3(0,3.2,0));
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.26,14,12), new THREE.MeshBasicMaterial({color:0x0a0512}));
  const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  gl.scale.set(2.4,2.4,1); orb.add(gl);
  const pl=new THREE.PointLight(col,2,8,2); orb.add(pl);
  orb.position.copy(from); scene.add(orb);
  let t=0; const dur=0.4;
  addRunner(dt=>{
    t+=dt; const u=Math.min(1,t/dur);
    orb.position.lerpVectors(from,to,u);
    if(Math.random()<0.8) spawnBurst({origin:orb.position,count:3,speed:1,size:0.14,color:col,life:0.3,gravity:0});
    if(u>=1){
      spawnBurst({origin:to,count:70,speed:5,size:0.18,color:col,life:0.6,gravity:0});
      shockRing(to.clone(), col, 4, 0.4, undefined);
      sfx.impact('dark'); shake(0.25);
      scene.remove(orb); orb.geometry.dispose();
      return true;
    }
    return false;
  });
}
function currentTaskName(){
  const t=tasks.find(x=>x.id===selectedId);
  return t?t.monsterName:'THE BEAST';
}

/* ---------- damage / red flash / death ---------- */
function redFlash(){
  mob.flash=1;
}
function applyFlash(dt){
  if(!currentMonster||!currentMonster.userData.originalMats) return;
  if(mob.flash>0) mob.flash=Math.max(0,mob.flash-dt*4);
  const f=mob.flash;
  for(const rec of currentMonster.userData.originalMats){
    if(rec.color) rec.m.color.copy(rec.color).lerp(new THREE.Color(0xff2a2a), f*0.85);
    if(rec.emissive) rec.m.emissive.copy(rec.emissive).lerp(new THREE.Color(0xff0000), f*0.85);
  }
}
function damageMonster(spell, at){
  mob.hp--;
  sfx.hurt();
  redFlash();
  renderHP();
  shake(0.35);
  // knockback wobble
  if(currentMonster){
    const away=currentMonster.position.clone().sub(at); away.y=0;
    if(away.lengthSq()<0.01) away.set(0,0,-1);
    away.normalize().multiplyScalar(0.8);
    const start=currentMonster.position.clone();
    tween(0.3,u=>{ if(currentMonster) currentMonster.position.copy(start).add(away.clone().multiplyScalar(Math.sin(u*Math.PI))); });
  }
  if(mob.hp<=0) deathSequence(spell, at);
}

async function deathSequence(spell, cursorPoint){
  const t=tasks.find(x=>x.id===selectedId);
  if(!t||!currentMonster) return;
  busy=true; mob.alive=false; clearBarrier(false); mob.face=null; updateHUD();
  const cin=document.getElementById('cinema');
  cin.classList.remove('kill'); void cin.offsetWidth; cin.classList.add('kill');
  sfx.death();
  const S=SPELLS[spell];
  const m=currentMonster;

  /* the vanquishing pours out FROM the cursor's strike point */
  const p=cursorPoint.clone();
  shockRing(p, S.hot, 11, 0.8, undefined);
  shockRing(p, S.color, 8, 0.6, Math.PI/2.6);
  shockRing(new THREE.Vector3(p.x,0.15,p.z), S.color, 12, 0.9);
  spawnBurst({origin:p,count:240,speed:10,size:0.26,color:S.color,life:1.2,gravity:1,up:false});
  spawnBurst({origin:p,count:100,speed:4,size:0.34,color:S.hot,life:0.7,gravity:0});
  boltFX(p.clone().add(new THREE.Vector3(0,10,0)), p, S.hot, 2, 0.3);
  const fl=new THREE.PointLight(S.hot, 9, 30, 2); fl.position.copy(p); scene.add(fl);
  tween(0.9,u=>{ fl.intensity=9*(1-u); }).then(()=>scene.remove(fl));
  shake(0.8);
  impactFX(spell, p);
  runeIntensityTarget=1; runeTargetColor.set(S.color); runeLight.color.set(S.color);
  toast(S.name.toUpperCase()+' CONSUMES '+t.monsterName.toUpperCase(), '#'+new THREE.Color(S.color).getHexString());

  // recoil, tint to spell color, dissolve, sink
  const t2XP = mob.maxHp*14 + (isOverdue(t.due)?20:0);
  const deathScreenPos = worldToScreen(m.position.clone().add(new THREE.Vector3(0,3,0)));
  const mats=[]; m.traverse(o=>{ if(o.isMesh&&o.material&&!Array.isArray(o.material)) mats.push(o.material); });
  mats.forEach(x=>{ x.transparent=true; });
  await tween(0.25,u=>{ m.rotation.z=Math.sin(u*Math.PI)*0.2; });
  const dieDur=1.5, tintCol=new THREE.Color(S.color);
  let t2=0;
  addRunner(dt=>{
    t2+=dt;
    if(Math.random()<0.85 && currentMonster) spawnBurst({origin:m.position.clone().add(new THREE.Vector3(rnd(-1,1), rnd(0.5,4.5)*Math.max(0.1,1-t2/dieDur), rnd(-1,1))),count:14,speed:2.6,size:0.18,color:S.color,life:0.8,gravity:1.8,up:true});
    return t2>=dieDur;
  });
  await tween(dieDur,u=>{
    const uu=easeInCubic(u);
    m.scale.setScalar(Math.max(0.001,(1-uu)*(m.userData.baseScale||1)));
    m.position.y=-uu*1.6;
    m.rotation.y+=0.06;
    mats.forEach(x=>{ x.opacity=1-u; if(x.color) x.color.lerp(tintCol,0.06); if(x.emissive) x.emissive.lerp(tintCol,0.06); });
  });
  disposeMonster();
  clearPatch();
  // golden victory motes rise from the rune
  spawnBurst({origin:new THREE.Vector3(0,0.4,0),count:150,speed:5,size:0.2,color:0xf0cc7e,life:1.4,gravity:2.4,up:true});
  toast('DEED FULFILLED — '+t.monsterName.toUpperCase()+' VANQUISHED');
  flyXPBolt(deathScreenPos, 30 + t2XP);

  const el=els.list.querySelector('[data-id="'+t.id+'"]'); if(el) el.classList.add('dying');
  await wait(0.7);
  const i=tasks.indexOf(t); if(i>=0) tasks.splice(i,1);
  const arr=sortedTasks();
  busy=false; finishing=false;
  if(arr.length){ selectTask(arr[0].id,true); }
  else {
    selectedId=null; renderList(); updateHUD();
    runeTargetColor.copy(RUNE_GREY); runeIntensityTarget=0;
    runeLight.color.copy(RUNE_GREY);
    monsterGlow.material.opacity=0;
  }
}

/* =====================================================================
   PORTAL CASTING — click: the rune DRAWS itself (~1s ritual), then fires
   ===================================================================== */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();

function portalPointFromClick(clientX, clientY){
  ndc.set((clientX/innerWidth)*2-1, -(clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const dir=raycaster.ray.direction, org=raycaster.ray.origin;
  /* the portal must sit ON the cursor ray, so it renders exactly under the click */
  let t=13;
  if(dir.y<-1e-4){
    const tg=(0.9-org.y)/dir.y;          // stop just above the ground
    if(tg>2.5) t=Math.min(tg, 30);
  }
  return org.clone().add(dir.clone().multiplyScalar(t));
}

/* the spell circle is DRAWN: ring of sparks traced around, glyphs fading in,
   power converging inward — then it detonates open, ready to fire */
function drawPortal(at, toward, spellKey, fast){
  const SP=SPELLS[spellKey]||{color:0x8d93a3, mid:0xb9bdc8, hot:0xffffff};
  const color=SP.color;
  const g=new THREE.Group(); g.position.copy(at); g.lookAt(toward); scene.add(g);
  const T = fast?0.4:0.85;                   // drawing time
  const R = 1.5;
  const disc=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.7),
    new THREE.MeshBasicMaterial({map:runeTex, color:SP.mid, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  const disc2=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6),
    new THREE.MeshBasicMaterial({map:runeTex, color:SP.color, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  gl.scale.set(5,5,1);
  const pl=new THREE.PointLight(color,0,11,2);
  g.add(disc,disc2,gl,pl);
  // tracer sparks laid clockwise around the circle as it is drawn
  const N=26, tracers=[];
  const hotTint=SP.hot;
  for(let i=0;i<N;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:hotTint,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.scale.set(0.5,0.5,1);
    const a=i/N*Math.PI*2;
    s.position.set(Math.cos(a)*R, Math.sin(a)*R, 0);
    g.add(s); tracers.push(s);
  }
  sfx.charge(fast);
  let t=0, phase='draw', closing=false, closeT=0, spun=0;
  let readyResolve; const ready=new Promise(r=>readyResolve=r);
  addRunner(dt=>{
    t+=dt; spun+=dt;
    disc.rotation.z+=dt*2.2; disc2.rotation.z-=dt*1.2;
    if(phase==='draw'){
      const u=Math.min(1,t/T);
      const lit=Math.floor(u*N);
      for(let i=0;i<N;i++) tracers[i].material.opacity = i<=lit ? Math.max(0.2, 1-(lit-i)*0.06) : 0;
      disc.material.opacity=u*0.55; disc.scale.setScalar(0.4+u*0.6);
      disc2.material.opacity=u*0.2; gl.material.opacity=u*0.35;
      pl.intensity=u*2.2;
      // power streams inward while the glyph is inscribed
      if(Math.random()<0.85){
        const a=Math.random()*Math.PI*2, rr=2.6;
        const wp=new THREE.Vector3(Math.cos(a)*rr,Math.sin(a)*rr,0).applyQuaternion(g.quaternion).add(g.position);
        spawnBurst({origin:wp,count:3,speed:-4,size:0.13,color,life:0.35,gravity:0,drag:1});
      }
      if(u>=1){
        phase='open'; t=0;
        // the circle SNAPS open
        disc.material.opacity=1; disc2.material.opacity=0.45; gl.material.opacity=0.8; pl.intensity=3.2;
        spawnBurst({origin:g.position.clone(),count:50,speed:3.5,size:0.15,color,life:0.4,gravity:0});
        shockRing(g.position.clone(), color, 2.6, 0.35, g.rotation.x);
        readyResolve();
      }
    }
    if(closing){
      closeT+=dt;
      const u=Math.min(1,closeT/0.3);
      g.scale.setScalar(Math.max(0.01,1-u));
      pl.intensity*= (1-u);
      disc.material.opacity*=(1-u); disc2.material.opacity*=(1-u); gl.material.opacity*=(1-u);
      if(u>=1){
        scene.remove(g);
        g.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
        return true;
      }
    }
    return false;
  });
  return { ready, close(){ closing=true; }, group:g };
}

/* full cast: draw ritual -> launch -> possible rune DEFLECTION -> impact */
function portalCast(origin, spell, opts){
  opts=opts||{};
  return new Promise(async resolve=>{
    const S=SPELLS[spell];
    const aim=()=> (currentMonster&&mob.alive)
      ? currentMonster.position.clone().add(new THREE.Vector3(0,2.9,0))
      : (opts.fallback||new THREE.Vector3(origin.x*0.4,0.3,origin.z*0.4-4));
    const portal=drawPortal(origin, aim(), spell, opts.fast);
    sfx.portal();

    // the beast SEES the circle being drawn: it wheels to face it...
    if(currentMonster && mob.alive){ mob.face=origin.clone(); }
    // ...and reacts: its OWN school is always turned aside; otherwise 33% rune, else dodge
    let willDeflect=false;
    if(currentMonster && mob.alive && !finishing && !opts.pierce){
      const ownSchool = (spell===IMMUNE[mob.biome]);
      if(!mob.barrier && (ownSchool || Math.random()<0.33)){
        setTimeout(()=>raiseBarrier(origin), 250);
        willDeflect=true;
      } else if(!mob.dodge && Math.random()<0.5){
        const perp=new THREE.Vector3(rnd(-1,1),0,rnd(-1,1)).normalize().multiplyScalar(2.4);
        mob.dodge={dir:perp, t:0, dur:0.4};
      }
    }

    await portal.ready;                      // the ritual completes

    sfx.cast[spell]();
    spawnBurst({origin, count:40, speed:2.6, size:0.16, color:S.color, life:0.4, gravity:0});
    const fx=ProjectileFX[spell]();
    const g=fx.group; g.position.copy(origin); g.scale.z=1.5; scene.add(g);
    const pl=new THREE.PointLight(fx.lightColor, fx.lightInt, 12, 2); g.add(pl);
    const beamGeo=new THREE.BufferGeometry().setFromPoints([origin.clone(), origin.clone()]);
    const beamMat=new THREE.LineBasicMaterial({color:S.hot, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending});
    const beam=new THREE.Line(beamGeo,beamMat); scene.add(beam);
    const SPEED=24;
    let closedPortal=false, t=0, deflected=false, groundTarget=null;
    addRunner(dt=>{
      t+=dt;
      const target = groundTarget || aim();
      const to=target.clone().sub(g.position);
      const d=to.length();
      if(d>1e-4){
        to.normalize();
        g.position.add(to.clone().multiplyScalar(Math.min(d, SPEED*dt)));
        g.lookAt(g.position.clone().add(to));
      }
      // rune barrier check: the spell RICOCHETS off the great glyph
      if(!deflected && !groundTarget && mob.barrier && currentMonster && mob.alive){
        const chest=currentMonster.position.clone().add(new THREE.Vector3(0,3,0));
        if(g.position.distanceTo(chest) <= mob.hitR+1.6){
          if(opts.pierce){
            clearBarrier(true, g.position.clone()); // barrage smashes straight through
          } else {
            deflected=true;
            clearBarrier(true, g.position.clone());
            // reflect away to a scorched patch of ground
            const ric=g.position.clone().sub(chest).normalize();
            groundTarget=g.position.clone().add(ric.multiplyScalar(6));
            groundTarget.add(new THREE.Vector3(rnd(-2,2),0,rnd(-2,2)));
            groundTarget.y=0.25;
          }
        }
      }
      beamGeo.setFromPoints([origin, g.position]);
      beamMat.opacity=Math.max(0, 0.55-t*0.4);
      fx.update(dt, g.position);
      if(!closedPortal && t>0.25){ portal.close(); closedPortal=true; }
      if(d<=SPEED*dt+0.15 || t>3.2){
        scene.remove(g, beam);
        beamGeo.dispose(); beamMat.dispose();
        if(!closedPortal) portal.close();
        if(currentMonster) mob.face=null;
        resolveImpact(spell, g.position.clone(), opts, deflected);
        resolve();
        return true;
      }
      return false;
    });
  });
}

function immuneFizzle(at, spell){
  sfx.immune();
  const t=tasks.find(x=>x.id===selectedId);
  toast((t?t.monsterName.toUpperCase():'THE BEAST')+' IS IMMUNE TO '+SPELLS[spell].name.toUpperCase(),'#aab');
  // the magic gutters out into grey ash on contact
  spawnBurst({origin:at,count:80,speed:2.2,size:0.16,color:0x9aa0aa,life:0.9,gravity:-4});
  spawnSmoke(at,4,false,0x777d88,true);
  // the beast swells with contempt
  if(currentMonster){
    const m=currentMonster;
    const bs=m.userData.baseScale||1;
    tween(0.5,u=>{ m.scale.setScalar(bs*(1+Math.sin(u*Math.PI)*0.12)); });
    spawnBurst({origin:m.position.clone().add(new THREE.Vector3(0,3,0)),count:40,speed:3,size:0.14,color:m.userData.eye||0xffffff,life:0.5,gravity:0});
  }
}
function resolveImpact(spell, at, opts, deflected){
  if(deflected){ impactFX(spell, at); sfx.impact(spell); return; }
  if(currentMonster && mob.alive && IMMUNE[mob.biome]===spell && !opts.pierce){
    immuneFizzle(at, spell);
    return;
  }
  impactFX(spell, at);
  sfx.impact(spell);
  if(!currentMonster || !mob.alive) return;
  damageMonster(spell, at);
}

/* =====================================================================
   VANQUISH — the deed is done: a finishing barrage fells the beast
   ===================================================================== */
async function vanquishNow(){
  if(!mob.alive || busy || finishing) return;
  if(selectedSpell===IMMUNE[mob.biome]){
    sfx.immune();
    toast(currentTaskName()+' IS IMMUNE TO '+SPELLS[selectedSpell].name.toUpperCase()+' — CHOOSE ANOTHER SCHOOL','#aab');
    return;
  }
  busy=true; updateHUD();
  sfx.ui();
  mob.hp=Math.min(mob.hp,3); renderHP();
  toast('THE DEED IS DONE — UNLEASH '+SPELLS[selectedSpell].name.toUpperCase());
  let vi=0;
  while(mob.alive && vi<10){
    const a=Math.random()*Math.PI*2;
    const origin=new THREE.Vector3(Math.cos(a)*9, rnd(3.5,7), Math.sin(a)*9);
    busy=false;                 // deathSequence needs to run when hp hits 0
    await portalCast(origin, selectedSpell, {fast:true});   // the beast MAY deflect these
    busy=true;
    vi++;
    if(mob.alive) await wait(0.15);
  }
  if(!mob.alive){ /* deathSequence has taken over */ }
  else { busy=false; updateHUD(); }
}

const RANKS=['Novice','Apprentice','Adept','Evoker','Conjurer','Warlock','Archmage','Grandmaster','Ascendant','Mythic'];
let xp=0, level=1;
function xpNeeded(){ return 50 + level*45; }
function renderXP(){
  document.getElementById('xpFill').style.width=Math.min(100, xp/xpNeeded()*100)+'%';
  document.getElementById('rankName').textContent=RANKS[Math.min(RANKS.length-1, level-1)];
  document.getElementById('lvlTag').textContent='Lv '+level;
}
function worldToScreen(v){
  const p=v.clone().project(camera);
  return {x:(p.x+1)/2*innerWidth, y:(1-p.y)/2*innerHeight};
}
/* a bolt of light streaks from the kill to the experience bar */
function flyXPBolt(fromScreen, amount){
  const bar=document.getElementById('xpFill').parentElement.getBoundingClientRect();
  const to={x:bar.left+bar.width*0.5, y:bar.top+bar.height*0.5};
  const mid={x:(fromScreen.x+to.x)/2 + (Math.random()*160-80), y:Math.min(fromScreen.y,to.y)-140};
  const b=document.createElement('div'); b.className='xpBolt';
  document.body.appendChild(b);
  const t0=performance.now(), dur=750;
  (function step(now){
    const u=Math.min(1,(now-t0)/dur);
    const iu=1-u;
    const x=iu*iu*fromScreen.x + 2*iu*u*mid.x + u*u*to.x;
    const y=iu*iu*fromScreen.y + 2*iu*u*mid.y + u*u*to.y;
    b.style.left=(x-9)+'px'; b.style.top=(y-9)+'px';
    b.style.opacity=String(0.5+0.5*Math.sin(u*20));
    if(u<1){ requestAnimationFrame(step); }
    else {
      b.remove();
      const f=document.getElementById('xpFill');
      f.classList.add('surge'); setTimeout(()=>f.classList.remove('surge'),700);
      sfx.ui();
      gainXP(amount);
    }
  })(t0);
}
function gainXP(amount){
  xp+=amount;
  toast('+'+amount+' EXPERIENCE');
  while(xp>=xpNeeded()){
    xp-=xpNeeded(); level++;
    sfx.levelup(); flarePanelRune();
    toast('✦ LEVEL '+level+' — '+RANKS[Math.min(RANKS.length-1,level-1)].toUpperCase()+' ✦');
    spawnBurst({origin:new THREE.Vector3(0,0.5,0),count:220,speed:6,size:0.22,color:0xf0cc7e,life:1.6,gravity:2.6,up:true});
    shockRing(new THREE.Vector3(0,0.2,0),0xf0cc7e,10,0.9);
    runeIntensityTarget=1;
  }
  renderXP();
}
